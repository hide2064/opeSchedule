services:
  app:
    ports:
      - "5678:5678"
    environment:
      LOG_LEVEL: debug
    command:
      [
        "python", "-m", "debugpy",
        "--listen", "0.0.0.0:5678",
        "--wait-for-client",
        "-m", "uvicorn", "app.main:app",
        "--reload", "--host", "0.0.0.0", "--port", "8000",
        "--log-level", "debug"
      ]
